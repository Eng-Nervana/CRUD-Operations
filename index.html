<html>

<head>
    <link rel="stylesheet" href="css/bootstrap.min.css">
</head>

<body class="bg-dark text-white">
    <div class="container p-5 ">
        <div>
            <div class="form-group my-3">
                <label for="productNameInput">Product Name:</label>
                <input id="productNameInput" type="text" class="form-control">
            </div>
            <div class="form-group my-3">
                <label for="productPriceInput">Product Price:</label>
                <input id="productPriceInput" type="number" class="form-control">
            </div>
            <div class="form-group my-3">
                <label for="productCategoryInput">Product Category:</label>
                <input id="productCategoryInput" type="text" class="form-control">
            </div>
            <div class="form-group my-3">
                <label for="productDescInput">Product Desc:</label>
                <textarea id="productDescInput" rows="5" class="form-control"></textarea>
            </div>

            <button id="addBtn" onclick="addProduct()" class="btn btn-info">Add Product</button>
        </div>
        <input id="searchInput" type="text" oninput="Search()" class="form-control mt-5 w-50 mx-auto" placeholder="Search...">
        <div class=" mt-5 ">
            <table class="table table-dark ">
                <thead>
                    <th>Index</th>
                    <th>Product name</th>
                    <th>Product price</th>
                    <th>Product Category</th>
                    <th>Product Desc</th>
                    <th>Update</th>
                    <th>Delete</th>
                </thead>
                <tbody id="tBody">
                   
                </tbody>
            </table>
        </div>
    </div>

    <script src="JS/index.js"></script>
</body>

</html>
